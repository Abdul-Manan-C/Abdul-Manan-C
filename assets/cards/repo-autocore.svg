<svg xmlns="http://www.w3.org/2000/svg" width="390" height="150" viewBox="0 0 390 150" role="img" aria-label="autocore — Automated pentest recon &amp; enumeration orchestrator"><style>.cu-static{display:none}.spin,.print{transform-box:view-box;transform-origin:150px 148px}.ping{transform-box:fill-box;transform-origin:center}.grow{transform-box:fill-box;transform-origin:bottom}@media (prefers-reduced-motion: reduce){.cu-motion{display:none}.cu-static{display:inline}.shine,.ring-pulse{display:none}}@media (prefers-reduced-motion: no-preference){.enter{animation:enter .6s cubic-bezier(.2,.7,.3,1) both}.grow{animation:grow .6s cubic-bezier(.2,.7,.3,1) both}.shine{animation:shine 7s ease-in-out infinite}.ring-pulse{animation:ringpulse 3.2s ease-out infinite}}@keyframes enter{from{transform:translateY(10px)}to{transform:none}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes shine{0%,72%{transform:translateX(-120%)}100%{transform:translateX(420%)}}@keyframes ringpulse{0%{transform:scale(.5);opacity:.9}70%,100%{transform:scale(2.4);opacity:0}}</style><g class="enter" style="animation-delay:0.05s"><animate attributeName="opacity" from="0" to="1" begin="0.05s" dur="0.60s" fill="freeze"/><rect width="390" height="150" rx="12" fill="#0d1117"/><rect x="0.5" y="0.5" width="389" height="149" rx="11.5" fill="none" stroke="#30363d"/><text x="18" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="650" fill="#e6edf3">autocore</text><text x="18" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">Automated pentest recon &amp; enumeration orchestrator</text><circle cx="22" cy="122" r="4" fill="#3572A5"/><text x="33" y="126" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b949e">Python</text><text x="372" y="126" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6e7681">★ 5 · 8mo ago</text></g></svg>
