<svg xmlns="http://www.w3.org/2000/svg" width="260" height="200" viewBox="0 0 260 200" role="img" aria-label="STUDIO: 10 engineering disciplines"><style>.cu-static{display:none}.spin,.print{transform-box:view-box;transform-origin:150px 148px}.ping{transform-box:fill-box;transform-origin:center}.grow{transform-box:fill-box;transform-origin:bottom}@media (prefers-reduced-motion: reduce){.cu-motion{display:none}.cu-static{display:inline}.shine,.ring-pulse{display:none}}@media (prefers-reduced-motion: no-preference){.enter{animation:enter .6s cubic-bezier(.2,.7,.3,1) both}.grow{animation:grow .6s cubic-bezier(.2,.7,.3,1) both}.shine{animation:shine 7s ease-in-out infinite}.ring-pulse{animation:ringpulse 3.2s ease-out infinite}}@keyframes enter{from{transform:translateY(10px)}to{transform:none}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes shine{0%,72%{transform:translateX(-120%)}100%{transform:translateX(420%)}}@keyframes ringpulse{0%{transform:scale(.5);opacity:.9}70%,100%{transform:scale(2.4);opacity:0}}</style><g class="enter" style="animation-delay:0.37s"><animate attributeName="opacity" from="0" to="1" begin="0.37s" dur="0.60s" fill="freeze"/><rect width="260" height="200" rx="12" fill="#0d1117"/><rect x="0.5" y="0.5" width="259" height="199" rx="11.5" fill="none" stroke="#30363d"/><defs><linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><g class="shine" opacity="0.5"><rect x="-90" y="-40" width="60" height="280" fill="url(#shineGrad)" transform="skewX(-18)"/></g><text x="18" y="36" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2.4" fill="#d29922">STUDIO</text><circle cx="232" cy="30" r="5" fill="#d29922"/><circle class="ring-pulse" cx="232" cy="30" r="7" fill="none" stroke="#d29922" stroke-width="1.2" opacity="0"/><g class="cu-motion"><text class="cu-step" x="18" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#e6edf3" opacity="0">0<set attributeName="opacity" to="1" begin="0.550s" dur="0.183s" fill="remove"/><set attributeName="opacity" to="0" begin="0.733s" fill="remove"/></text><text class="cu-step" x="18" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#e6edf3" opacity="0">2<set attributeName="opacity" to="1" begin="0.733s" dur="0.183s" fill="remove"/><set attributeName="opacity" to="0" begin="0.917s" fill="remove"/></text><text class="cu-step" x="18" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#e6edf3" opacity="0">3<set attributeName="opacity" to="1" begin="0.917s" dur="0.183s" fill="remove"/><set attributeName="opacity" to="0" begin="1.100s" fill="remove"/></text><text class="cu-step" x="18" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#e6edf3" opacity="0">5<set attributeName="opacity" to="1" begin="1.100s" dur="0.183s" fill="remove"/><set attributeName="opacity" to="0" begin="1.283s" fill="remove"/></text><text class="cu-step" x="18" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#e6edf3" opacity="0">7<set attributeName="opacity" to="1" begin="1.283s" dur="0.183s" fill="remove"/><set attributeName="opacity" to="0" begin="1.467s" fill="remove"/></text><text class="cu-step" x="18" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#e6edf3" opacity="0">8<set attributeName="opacity" to="1" begin="1.467s" dur="0.183s" fill="remove"/><set attributeName="opacity" to="0" begin="1.650s" fill="remove"/></text><text class="cu-step" x="18" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#e6edf3">10<set attributeName="opacity" to="0" begin="0.550s" fill="freeze"/><set attributeName="opacity" to="1" begin="1.650s" fill="freeze"/></text></g><text class="cu-static" x="18" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#e6edf3">10</text><text x="18" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#c9d1d9">engineering disciplines</text><text x="18" y="170" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6e7681">3D · dashboards · AI · SEO</text></g></svg>
