name: Platform Screenshots

on:
  schedule:
    - cron: "24 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: python -m pip install --quiet fonttools brotli

      - name: Capture live platform screenshots
        run: node scripts/cdp_capture.mjs assets/screens

      - name: Render social preview
        run: python scripts/make_social_preview.py

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screens assets/social-preview.png assets/social-preview.svg
          if git diff --cached --quiet; then
            echo "screenshots are already current"
            exit 0
          fi
          git commit -m "chore: refresh platform screenshots [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
