name: Profile Art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install font tooling
        run: python -m pip install --quiet fonttools brotli pillow

      - name: Rebuild console art and repository index
        run: python scripts/build_profile_art.py

      - name: Rebuild phone-sized screenshots
        run: python scripts/shrink_screens.py

      - name: Verify the README against the design rules
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_readme.py --tag ci

      - name: Commit refreshed art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md data/profile.json
          if git diff --cached --quiet; then
            echo "art is already current"
            exit 0
          fi
          git commit -m "chore: refresh profile art [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
